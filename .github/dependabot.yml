version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      three:
        patterns:
          - three
          - "@types/three"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
